name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358"
      - run: go test ./...
      - run: go vet ./...
      - run: ./scripts/build-ios.sh
      - run: ./scripts/build-android.sh
